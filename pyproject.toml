[project]
name = "zymecycle"
version = "0.0.1"
description = "PETzyme scientific data tools"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
protein = ["torch==2.8.0", "transformers==4.57.6"]
ui = ["streamlit==1.66.1"]
dev = ["mypy==1.18.2", "ruff==0.14.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = ["real_model: explicitly enabled local pretrained ESM-2 smoke test"]

# Incremental strict scope: dialogue contracts, shared privacy/configuration and numeric telemetry.
# Imported legacy/provider/scientific modules retain their existing runtime checks.
[tool.mypy]
files = ["zymecycle/privacy.py", "zymecycle/runtime_config.py", "zymecycle/dialogue_types.py", "zymecycle/clarification_intent.py", "zymecycle/dialogue.py", "zymecycle/dialogue_rules.py", "zymecycle/meta_telemetry.py", "zymecycle/decision_types.py", "zymecycle/decision.py", "zymecycle/decision_context.py", "zymecycle/decision_schema.py"]
strict = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "streamlit.*", "numpy.*", "pandas.*", "pyarrow.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
